name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ─── Build + upload assets to a pre-created draft release ────────────────────
  # Strategy: create the GitHub release FIRST (gh release create), capture its
  # numeric ID, then pass that ID to tauri-action via `releaseId`.  This avoids
  # the race condition where tauri-action queries the GitHub API before the pushed
  # tag is fully visible, which caused releases to be named "untagged-<hash>".
  build-windows:
    runs-on: windows-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      # ── 1. Create the draft release and capture its numeric ID ───────────────
      - name: Create GitHub draft release
        id: create_release
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          IS_PRE=${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          PRE_FLAG=""
          if [ "$IS_PRE" = "true" ]; then PRE_FLAG="--prerelease"; fi

          # `gh release create --json id` returns the numeric ID directly
          RELEASE_ID=$(gh release create "$TAG" \
            --draft \
            $PRE_FLAG \
            --title "Kiyoshi Music $TAG" \
            --notes "Build in progress…" \
            --target "${{ github.sha }}" \
            --json id \
            --jq '.id')

          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Created draft release id=$RELEASE_ID for tag=$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create build directories
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          New-Item -ItemType Directory -Force src-tauri/resources | Out-Null

      - name: Install Python dependencies
        working-directory: python-backend
        run: pip install -r requirements.txt pyinstaller

      - name: Build Python server (Windows)
        working-directory: python-backend
        run: |
          pyinstaller kiyoshi-server-x86_64-pc-windows-msvc.spec `
            --distpath ../src-tauri/binaries `
            --workpath build_tmp/kiyoshi-server-x86_64-pc-windows-msvc

      - name: Download node.exe
        run: |
          Invoke-WebRequest `
            -Uri "https://nodejs.org/dist/v20.11.0/win-x64/node.exe" `
            -OutFile "src-tauri/resources/node.exe"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── 2. Build with tauri-action, uploading to the pre-created release ─────
      - name: Build Tauri NSIS installer + updater bundle
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ steps.create_release.outputs.release_id }}
          args: --target x86_64-pc-windows-msvc --bundles nsis

  # ── Update release notes from CHANGELOG (keeps release as draft) ─────────────
  finalize:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Update draft release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          # Look up the release ID from the full list (includes drafts).
          # The /releases/tags/{tag} endpoint only returns published releases,
          # so we filter the list instead.
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id")

          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: Could not find draft release for tag $TAG"
            exit 1
          fi

          # Extract changelog for this version
          RELEASE_NOTES=""
          if [ -f CHANGELOG.md ]; then
            RELEASE_NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md \
              | sed '/^[[:space:]]*$/d' | head -80)
          fi

          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            --method PATCH \
            --field draft=true \
            --field body="${RELEASE_NOTES}"

          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  Release $TAG built — left as DRAFT for manual review."
          echo "  → Publish in GitHub UI when ready."
          echo "  → Then trigger 'Update latest.json' workflow manually."
          echo "═══════════════════════════════════════════════════════════════"
